name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    # Keep each staged provenance PR subject to Ubuntu/macOS gates.
    branches: [ main, 'codex/original-source-provenance', 'codex/source-provenance-*' ]

# Cancel in-progress runs when a new commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------------
      # System dependencies
      #
      # WebSocket++, standalone Asio, and GoogleTest are pinned and fetched by
      # CMake. httplib.h and nlohmann/json are vendored under `third_party/`.
      # --------------------------------------------------------------
      # Hosted images provide these tools. Fail on image drift instead of
      # updating apt/Homebrew and reinstalling them on every job.
      - name: Verify runner tools
        run: |
          cmake --version
          ninja --version
          c++ --version
          node --version
          npm --version
          python3 --version
          curl --version

      - name: Check README counter source
        run: python3 scripts/check_readme_counter.py

      - name: macOS artifact guards
        run: python3 tests/test_macos_distribution.py

      - name: RC preparation guards
        run: python3 tests/test_prepare_rc.py

      - name: Install Chrome headless shell
        run: |
          driver="${RUNNER_TEMP}/playwright-driver"
          export PLAYWRIGHT_BROWSERS_PATH="${RUNNER_TEMP}/ms-playwright"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --prefix "${driver}" --no-save playwright@1.63.0
          # Keep Playwright's pinned browser; the hosted image supplies system
          # libraries. Check linking and real execution below, without a second
          # apt update/install via --with-deps (including fonts and Xvfb).
          "${driver}/node_modules/.bin/playwright" install chromium-headless-shell
          browser="$(find "${PLAYWRIGHT_BROWSERS_PATH}" -type f -name chrome-headless-shell -perm -111 -print -quit)"
          test -n "${browser}"
          echo "JTML_BENCH_BROWSER=${browser}" >> "${GITHUB_ENV}"
          echo "JTML_BROWSER_BENCH_PLAYWRIGHT_ROOT=${driver}" >> "${GITHUB_ENV}"
          "${browser}" --version
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            ldd "${browser}" | tee "${RUNNER_TEMP}/chromium-libraries.txt"
            if grep -q 'not found' "${RUNNER_TEMP}/chromium-libraries.txt"; then
              echo "::error::Runner image is missing Chromium shared libraries"
              exit 1
            fi
          fi
          # --version alone cannot prove renderer startup or dynamic libraries.
          node - "${driver}" "${browser}" <<'JS'
          const assert = require('node:assert/strict');
          const { chromium } = require(`${process.argv[2]}/node_modules/playwright`);
          (async () => {
            const browser = await chromium.launch({ executablePath: process.argv[3], headless: true });
            try {
              const page = await browser.newPage();
              await page.setContent('<button onclick="this.textContent = 42">Run</button>');
              await page.locator('button').click();
              assert.equal(await page.locator('button').textContent(), '42');
              console.log(`Chromium renderer verified: ${browser.version()}`);
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS

      # --------------------------------------------------------------
      # Configure, build, test
      # --------------------------------------------------------------
      - name: Configure
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DJTML_BUILD_PYTHON=OFF
          -DJTML_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        working-directory: build
        run: ctest --output-on-failure --parallel

      - name: Production reference application (browser required)
        run: scripts/test_production_reference.sh

      - name: Strict CSP root and dynamic events (browser required)
        run: node tests/browser/strict_csp.cjs

      - name: Root conditional component lifecycle (browser required)
        run: node tests/browser/root_conditional_mount.cjs

      - name: ReleaseDesk real persistence (browser required)
        run: scripts/test_releasedesk.sh

      - name: Adversarial Taskboard Core C01–C14 (browser required)
        run: scripts/test_taskboard_core.sh

      - name: Taskboard negatives and diagnostic provenance audit (browser required)
        run: scripts/test_taskboard_negative.sh

      - name: Strict original-source provenance
        run: scripts/test_source_provenance.sh

      - name: Differential semantic conformance (reviewed discrepancies explicit)
        run: scripts/test_semantic_conformance.sh

      - name: Preserve semantic conformance evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: semantic-conformance-${{ matrix.os }}
          path: dist/conformance
          if-no-files-found: warn
          retention-days: 7

      - name: Nested keyed lifecycle regressions (browser required)
        run: scripts/test_keyed_lifecycle.sh

      - name: Local HTTP and WebSocket security (browser required)
        run: scripts/test_local_server_security.sh

      - name: Owned async HTTP and WebSocket runtime
        run: scripts/test_async_runtime.sh

      - name: Browser literal fidelity (clean and compatibility)
        run: scripts/test_literal_fidelity.sh

      - name: JTML smoke tests
        run: ./build/jtml test

      - name: Predeploy site and package artifacts
        run: |
          scripts/build_site.sh dist/site
          node tests/browser/site.cjs dist/site
          scripts/package_cli.sh dist/release
          test -f dist/site/tools.html
          test -f dist/release/bin/jtml
          # CPack rewrites install_manifest.txt; keep the explicit install last.
          cpack --config build/CPackConfig.cmake -B dist/cpack
          cmake --install build --prefix "${RUNNER_TEMP}/jtml-install"
          for dest in dist/release dist/site "${RUNNER_TEMP}/jtml-install/share/doc/jtml"; do
            cmp LICENSE "${dest}/LICENSE"
            cmp THIRD_PARTY_NOTICES.md "${dest}/THIRD_PARTY_NOTICES.md"
            for notice in third_party/licenses/*; do
              cmp "${notice}" "${dest}/${notice}"
            done
          done
          python3 scripts/test_studio_distribution.py \
            --cpack-archive "dist/cpack/$(cat build/jtml-cpack-filename.txt)" \
            --archive "dist/jtml-$(cat build/jtml-version.txt)-$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m).tar.gz" \
            --install-prefix "${RUNNER_TEMP}/jtml-install"

      # --------------------------------------------------------------
      # Integration: every bundled example must pass `jtml lint`.
      # This catches regressions in the linter or parser that
      # unit tests might miss.
      # --------------------------------------------------------------
      - name: Lint all bundled examples
        run: |
          set -e
          fail=0
          for f in examples/*.jtml; do
            # Keep the existing exclusions explicit; this gate does not cover
            # every example. Cross-file semantic resolution exists, but these
            # fixtures need a separate audit before changing gate coverage.
            case "$f" in
              examples/keywords.jtml|\
              examples/jtml_studio.jtml|\
              examples/friendly_import_page.jtml|\
              examples/friendly_advanced_form.jtml) continue ;;
            esac
            if ! ./build/jtml lint "$f"; then
              echo "::error file=$f::lint failed"
              fail=1
            fi
          done
          exit $fail

      - name: Formatter idempotence on all examples
        run: |
          set -e
          # Keep relative imports resolvable on the second pass. Unique hidden
          # files avoid collisions and are not included in the *.jtml loop.
          pass1="$(mktemp "$PWD/examples/.fmt-pass1.XXXXXX")"
          pass2="$(mktemp "$PWD/examples/.fmt-pass2.XXXXXX")"
          trap 'rm -f "$pass1" "$pass2"' EXIT
          for f in examples/*.jtml; do
            ./build/jtml fmt "$f" > "$pass1"
            ./build/jtml fmt "$pass1" > "$pass2"
            if ! diff -q "$pass1" "$pass2" > /dev/null; then
              echo "::error file=$f::formatter not idempotent"
              diff "$pass1" "$pass2" || true
              exit 1
            fi
          done
