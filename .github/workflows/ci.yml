name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs when a new commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------------
      # System dependencies
      #
      # WebSocket++, standalone Asio, and GoogleTest are pinned and fetched by
      # CMake. httplib.h and nlohmann/json are vendored under `third_party/`.
      # --------------------------------------------------------------
      - name: Install deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake ninja

      # --------------------------------------------------------------
      # Configure, build, test
      # --------------------------------------------------------------
      - name: Configure
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DJTML_BUILD_PYTHON=OFF
          -DJTML_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        working-directory: build
        run: ctest --output-on-failure --parallel

      - name: JTML smoke tests
        run: ./build/jtml test

      - name: Predeploy site and package artifacts
        run: |
          scripts/build_site.sh dist/site
          scripts/package_cli.sh dist/release
          test -f dist/site/tools.html
          test -f dist/release/bin/jtml

      # --------------------------------------------------------------
      # Integration: every bundled example must pass `jtml lint`.
      # This catches regressions in the linter or parser that
      # unit tests might miss.
      # --------------------------------------------------------------
      - name: Lint all bundled examples
        run: |
          set -e
          fail=0
          for f in examples/*.jtml; do
            # Keep the existing exclusions explicit; this gate does not cover
            # every example. Cross-file semantic resolution exists, but these
            # fixtures need a separate audit before changing gate coverage.
            case "$f" in
              examples/keywords.jtml|\
              examples/jtml_studio.jtml|\
              examples/friendly_import_page.jtml|\
              examples/friendly_advanced_form.jtml) continue ;;
            esac
            if ! ./build/jtml lint "$f"; then
              echo "::error file=$f::lint failed"
              fail=1
            fi
          done
          exit $fail

      - name: Formatter idempotence on all examples
        run: |
          set -e
          # Keep relative imports resolvable on the second pass. Unique hidden
          # files avoid collisions and are not included in the *.jtml loop.
          pass1="$(mktemp "$PWD/examples/.fmt-pass1.XXXXXX")"
          pass2="$(mktemp "$PWD/examples/.fmt-pass2.XXXXXX")"
          trap 'rm -f "$pass1" "$pass2"' EXIT
          for f in examples/*.jtml; do
            ./build/jtml fmt "$f" > "$pass1"
            ./build/jtml fmt "$pass1" > "$pass2"
            if ! diff -q "$pass1" "$pass2" > /dev/null; then
              echo "::error file=$f::formatter not idempotent"
              diff "$pass1" "$pass2" || true
              exit 1
            fi
          done
